apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "st.fullname" . }}-migrate
  labels:
    {{- include "st.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "st.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "st.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              until pg_isready -h {{ include "st.postgresName" . }} -p 5432
              -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }};
              do echo "waiting for postgres"; sleep 2; done
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "st.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["supertrends"]
          args: ["db", "migrate"]
          env:
            {{- include "st.env" . | nindent 12 }}
          envFrom:
            {{- include "st.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "st.scheduling" . | nindent 6 }}
