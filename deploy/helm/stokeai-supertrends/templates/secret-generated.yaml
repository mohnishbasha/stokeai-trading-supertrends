{{- if include "st.generateSecret" . }}
{{- /*
Credentials for the bundled Postgres (kind and self-host): generated at install time, never
committed. A pre-install hook so it exists before the Postgres hook and the migration Job. An
existing Secret is reused so a reinstall keeps the password that the persistent volume was
initialised with.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "st.secretName" .) }}
{{- $password := randAlphaNum 32 }}
{{- $token := randAlphaNum 48 }}
{{- if $existing }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- $token = index $existing.data "SUPERTRENDS_API_TOKEN" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "st.secretName" . }}
  labels:
    {{- include "st.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  SUPERTRENDS_API_TOKEN: {{ $token | quote }}
  SUPERTRENDS_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.user $password (include "st.postgresName" .) .Values.postgres.database | quote }}
{{- end }}
