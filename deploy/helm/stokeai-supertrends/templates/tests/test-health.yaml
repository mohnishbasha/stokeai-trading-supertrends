apiVersion: v1
kind: Pod
metadata:
  name: {{ include "st.fullname" . }}-test-health
  labels:
    {{- include "st.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: healthcheck
      image: {{ include "st.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # GET /readyz through the Service DNS name, from inside the cluster.
      command: ["supertrends"]
      args: ["healthcheck", "--url", "http://{{ include "st.fullname" . }}:{{ .Values.service.port }}"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
