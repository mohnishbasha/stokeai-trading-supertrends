#
# Local kind cluster and CI (ARCHITECTURE section 10.6 profile table). Fixture providers, bundled
# Postgres, template narratives. The Postgres password and API token are generated by the chart
# at install time; nothing secret is committed. The image is loaded with "make kind-load".
env: ci

image:
  pullPolicy: IfNotPresent   # make helm-install sets image.repository and image.tag from IMAGE and VERSION

service:
  type: NodePort
  nodePort: 30080            # mapped to the host by deploy/kind/cluster.yaml

providers:
  market: fixture
  fundamentals: fixture

llm:
  narrativeProvider: template

secrets:
  existingSecret: ""         # empty: use the Secret the chart generates for the bundled Postgres

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
    digest: sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
