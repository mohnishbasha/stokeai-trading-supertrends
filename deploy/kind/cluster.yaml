# Local kind cluster (ADR-070). One node; the API NodePort 30080 is published on the host so
# SMOKE_BASE_URL can reach it. "make kind-up" rewrites hostPort 18080 to SUPERTRENDS_HOST_PORT.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # kind v0.33.0 recommended image for Kubernetes 1.34 (release notes, checked 2026-11-17).
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
