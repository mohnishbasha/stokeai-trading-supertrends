#
# "make up" runs the built image ("make image") with Postgres. Sprint 0: app and Postgres.
# The migrate and seed one-shots and the LLM mock arrive with Sprints 1 and 3.
name: supertrends-local

services:
  app:
    image: ${IMAGE:-ghcr.io/mohnishbasha/stokeai-supertrends}:${VERSION:-0.1.0}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${SUPERTRENDS_HOST_PORT:-8080}:8080"
    environment:
      SUPERTRENDS_ENV: dev
      SUPERTRENDS_BIND: 0.0.0.0:8080
      SUPERTRENDS_DATABASE_URL: postgresql+psycopg://supertrends:supertrends@postgres:5432/supertrends
      SUPERTRENDS_ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "supertrends", "healthcheck", "--url", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  migrate:
    image: ${IMAGE:-ghcr.io/mohnishbasha/stokeai-supertrends}:${VERSION:-0.1.0}
    command: ["db", "migrate"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SUPERTRENDS_DATABASE_URL: postgresql+psycopg://supertrends:supertrends@postgres:5432/supertrends
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_USER: supertrends
      POSTGRES_PASSWORD: supertrends  # local-only credential, never used outside this file
      POSTGRES_DB: supertrends
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertrends -d supertrends"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
