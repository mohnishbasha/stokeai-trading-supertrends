[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supertrends"
dynamic = ["version"]
description = "Supertrend market agent that scores a watchlist daily and publishes the top 3 buys and top 2 sells with a written justification."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [{ name = "Serverless Ventures LLC", email = "legal@serverlessvc.com" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.9",
    "pyyaml>=6.0",
    "typer>=0.13",
    "httpx>=0.27",
    "structlog>=24.4",
    "exchange-calendars>=4.13.3",
]

[project.urls]
Source = "https://github.com/mohnishbasha/stokeai-trading-supertrends"

[project.scripts]
supertrends = "supertrends.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pytest-socket>=0.8.1",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9][^\\s]*)"

[tool.hatch.build.targets.wheel]
packages = ["src/supertrends"]

[tool.hatch.build.targets.sdist]
include = ["src/supertrends", "VERSION", "LICENSE", "COPYRIGHT", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["ui", "integrations", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL", "PT", "T20", "TD", "N"]
ignore = ["PLR2004", "TD003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true  # the library ships no type stubs

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs services such as Postgres or Docker"]

[tool.coverage.run]
branch = true
source = ["src/supertrends"]

[tool.coverage.report]
show_missing = true
skip_empty = true
